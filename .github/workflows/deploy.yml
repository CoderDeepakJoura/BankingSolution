name: Deploy to Production

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: false
        default: 'both'
        type: choice
        options: [both, frontend, backend]

# ─── Jobs ────────────────────────────────────────────────────────────────────
jobs:

  # ── Detect which parts of the repo changed ──────────────────────────────────
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend:  ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'client/**'
            backend:
              - 'backend/**'

  # ── Frontend: build Vite + rsync to /var/www/banking-frontend ───────────────
  deploy-frontend:
    name: Build & Deploy Frontend
    needs: detect-changes
    if: |
      (github.event_name == 'push'             && needs.detect-changes.outputs.frontend == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'both' || github.event.inputs.target == 'frontend'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build (vite build)
        run: npm run build
        working-directory: client

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to /var/www/banking-frontend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            client/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/banking-frontend/

  # ── Backend: publish .NET + rsync to /var/www/banking-api ───────────────────
  deploy-backend:
    name: Build & Deploy Backend
    needs: detect-changes
    if: |
      (github.event_name == 'push'             && needs.detect-changes.outputs.backend == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'both' || github.event.inputs.target == 'backend'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore backend/BankingPlatform.sln

      - name: Publish release build
        run: |
          dotnet publish backend/BankingPlatform.API/BankingPlatform.API.csproj \
            --configuration Release \
            --output ./publish \
            --no-restore

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Stop both API services
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "systemctl stop banking-api.service hindu-society-api.service && echo 'Services stopped'"

      # appsettings.json  → server-specific (DB connection string, JWT secret, CORS, DocPaths)
      # appsettings.*.json → any environment override files
      # web.config         → IIS / reverse-proxy config managed on server
      # Logs/ uploads/     → runtime directories, never overwritten
      - name: Rsync binaries (preserve server config files)
        run: |
          rsync -avz --delete \
            --exclude='appsettings.json' \
            --exclude='appsettings.*.json' \
            --exclude='web.config' \
            --exclude='logs/' \
            --exclude='Logs/' \
            --exclude='uploads/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./publish/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/banking-api/

      # Always runs — ensures both services are back up even if rsync failed
      - name: Start both API services & verify
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "
            systemctl start banking-api.service hindu-society-api.service
            sleep 6
            FAILED=0
            for svc in banking-api.service hindu-society-api.service; do
              if systemctl is-active --quiet \$svc; then
                echo \"✅ \$svc is running\"
              else
                echo \"❌ \$svc failed to start\"
                journalctl -u \$svc -n 30 --no-pager
                FAILED=1
              fi
            done
            exit \$FAILED
            "
